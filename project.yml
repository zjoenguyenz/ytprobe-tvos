name: YTProbe
options:
  bundleIdPrefix: com.luun.nguyen
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    # Swift 6 language mode, same as JoeTV (owner order
    # 2026-11-18): strict concurrency is part of the mode.
    # The probe is held to the same bar — strict-mode clean
    # by construction, not by luck (owner order 2026-11-20).
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  YTProbe:
    type: application
    platform: tvOS
    sources:
      - YTProbe/YTProbeApp.swift
      - YTProbe/ProbeDiagLog.swift
      - YTProbe/ProbeWeb.swift
      - YTProbe/ProbePages.swift
      - YTProbe/ProbeExtract.swift
      - YTProbe/ProbeSabr.swift
      - YTProbe/ProbeDoor.swift
      - YTProbe/ProbeDevice.swift
      - YTProbe/ProbeDowngraded.swift
      - YTProbe/ProbeSigN.swift
      - YTProbe/ProbeEjs.swift
      - YTProbe/ProbeUnified.swift
      - path: YTProbe/yt.solver.lib.min.js
        buildPhase: resources
      - path: YTProbe/yt.solver.core.min.js
        buildPhase: resources
      - YTProbe/JoeWebBridge.h
      - YTProbe/JoeWebBridge.m
      - YTProbe/YTProbe-Bridging-Header.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luun.nguyen.ytprobe
        INFOPLIST_FILE: InfoYTProbe.plist
        SWIFT_OBJC_BRIDGING_HEADER: YTProbe/YTProbe-Bridging-Header.h
        MARKETING_VERSION: "0.2.3"
        CURRENT_PROJECT_VERSION: "14"
    info:
      path: InfoYTProbe.plist
      properties:
        CFBundleDisplayName: "YT Probe"
        CFBundleName: "YT Probe"
        CFBundleShortVersionString: "0.2.3"
        CFBundleVersion: "14"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The diagnostic-log export serves the log over the
        # home LAN (tvOS has no share sheet) — same pattern
        # as JoeTV's LOG RETRIEVAL LAW implementation.
        NSLocalNetworkUsageDescription: "YT Probe mở một kênh trong mạng nhà để anh tải file log chẩn đoán từ Apple TV về iPhone."
