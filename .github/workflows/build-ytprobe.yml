name: Build YT Probe tvOS IPA (unsigned)

# YT Probe: the standalone tvOS probe harness for the JoeTV
# YouTube mechanisms (owner strategy 2026-11-20: prove each
# mechanism in this small app first; only what works gets
# embedded into JoeTV). Manual dispatch only, like JoeTV's
# workflow. The probe holds NO secrets, so unlike JoeTV's
# workflow there are no injection steps at all.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.x"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project YTProbe.xcodeproj \
            -scheme YTProbe \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/YTProbe.app"
          test -d "$APP_PATH"
          STAGE="$PWD/ipa-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"
          OUT="$PWD/YTProbe.ipa"
          (cd "$STAGE" && /usr/bin/zip -qry "$OUT" Payload)
          ls -la "$OUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTProbe-ipa-run${{ github.run_number }}-${{ '' }}
          path: YTProbe.ipa
          if-no-files-found: error
